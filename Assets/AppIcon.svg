<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4C7E"/>
      <stop offset="1" stop-color="#16294A"/>
    </linearGradient>
    <linearGradient id="caseGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.30" stop-color="#E9EEF4"/>
      <stop offset="0.75" stop-color="#C9D3DE"/>
      <stop offset="1" stop-color="#AEBBC9"/>
    </radialGradient>
    <linearGradient id="sheenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1E8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="sheenB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <clipPath id="discClip"><circle cx="160" cy="134" r="84"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- second case peeking out behind: "a collection" -->
  <rect x="38" y="30" width="148" height="176" rx="14" fill="#3D6699" filter="url(#shadow)"/>
  <!-- front jewel case -->
  <g filter="url(#shadow)">
    <rect x="22" y="48" width="152" height="180" rx="14" fill="url(#case)"/>
    <rect x="22" y="48" width="22" height="180" rx="10" fill="#4A79B5"/>
    <rect x="34" y="48" width="10" height="180" fill="#4A79B5"/>
    <rect x="22" y="48" width="152" height="180" rx="14" fill="url(#caseGlass)"/>
  </g>
  <!-- label lines on the case, like a spine/inventory list -->
  <rect x="58" y="176" width="64" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="58" y="194" width="44" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.32"/>

  <!-- the disc, sliding out of the case -->
  <g filter="url(#shadow)">
    <circle cx="160" cy="134" r="84" fill="url(#disc)"/>
  </g>
  <g clip-path="url(#discClip)">
    <path d="M160 134 L100 30 A120 120 0 0 1 230 50 Z" fill="url(#sheenA)" opacity="0.55"/>
    <path d="M160 134 L90 238 A120 120 0 0 1 60 170 Z" fill="url(#sheenB)" opacity="0.45"/>
    <path d="M160 134 L262 150 A120 120 0 0 1 222 226 Z" fill="url(#sheenA)" opacity="0.30"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5">
    <circle cx="160" cy="134" r="44"/><circle cx="160" cy="134" r="58"/><circle cx="160" cy="134" r="72"/>
  </g>
  <circle cx="160" cy="134" r="83" fill="none" stroke="#8494A8" stroke-width="2"/>
  <circle cx="160" cy="134" r="30" fill="#F4F7FA" stroke="#9AA8B8" stroke-width="2"/>
  <circle cx="160" cy="134" r="12" fill="#16294A"/>
</svg>
