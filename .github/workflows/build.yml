# Builds the desktop app and its Windows installer on GitHub's machines.
#
# Runs on every pull request and every push to main (and on demand from the Actions tab).
# A pull request shows a green check or red X when it's done.
#
# Each run has two downloads at the bottom of its page under "Artifacts":
#   CDInventory-Setup     the installer: run it to install or upgrade the app
#   CDInventory-portable  the plain app folder: unzip and run AvaloniaCDInventory.exe, nothing installed
#
# Releasing a version: set <Version> in AvaloniaCDInventory.csproj (e.g. 2.3.0), merge it to main,
# then push a matching tag (v2.3.0). GitHub then publishes a Release on the repo's Releases page
# with the installer attached.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read the version number
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path AvaloniaCDInventory.csproj -Pattern '<Version>(.+)</Version>'
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME doesn't match <Version>$version</Version> in AvaloniaCDInventory.csproj"
            exit 1
          }
          "number=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Build and publish for Windows
        run: >
          dotnet publish AvaloniaCDInventory.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      # Inno Setup comes preinstalled on GitHub's Windows machines
      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.version.outputs.number }}" installer\CDInventory.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Install it silently on the build machine, check everything landed, then uninstall
      - name: Test the installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\Output\*.exe).FullName
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs\CD Inventory'
          $exe = Join-Path $appDir 'AvaloniaCDInventory.exe'
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\CD Inventory.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'CD Inventory.lnk'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{76674D4E-3291-490C-9D4B-3B743218C642}_is1'
          $failed = $false
          function Check($ok, $what) {
            if ($ok) { Write-Host "OK   $what" } else { Write-Host "FAIL $what"; $script:failed = $true }
          }

          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=desktopicon' -Wait
          Check (Test-Path $exe) "app installed to $appDir"
          Check (Test-Path $startMenu) 'Start menu shortcut'
          Check (Test-Path $desktop) 'desktop shortcut'
          $entry = Get-ItemProperty $uninstallKey -ErrorAction SilentlyContinue
          Check ($null -ne $entry) 'listed in Settings > Apps'
          if ($entry) {
            Check ($entry.DisplayVersion -eq '${{ steps.version.outputs.number }}') "version shown as $($entry.DisplayVersion)"
          }
          if (Test-Path $exe) {
            Check ((Get-Item $exe).VersionInfo.ProductName -eq 'CD Inventory') 'product name on the .exe'
          }

          $uninstaller = Join-Path $appDir 'unins000.exe'
          if (Test-Path $uninstaller) {
            Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
            Start-Sleep -Seconds 3   # the uninstaller finishes cleaning up after it exits
          }
          Check (-not (Test-Path $exe)) 'uninstall removed the app'
          Check (-not (Test-Path $startMenu)) 'uninstall removed the Start menu shortcut'
          Check (-not (Test-Path $desktop)) 'uninstall removed the desktop shortcut'
          if ($failed) { exit 1 }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: CDInventory-Setup
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload the portable build
        uses: actions/upload-artifact@v7
        with:
          name: CDInventory-portable
          path: publish/
          retention-days: 30

  # Only for version tags: publish a GitHub Release with the installer attached
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the installer
        uses: actions/download-artifact@v8
        with:
          name: CDInventory-Setup

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" *.exe
          --repo "$GITHUB_REPOSITORY"
          --title "CD Inventory ${GITHUB_REF_NAME#v}"
          --generate-notes
